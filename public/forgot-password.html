<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>
      Forget Password
    </title>

    <link
      rel="stylesheet"
      href="9Style.css"
    >

</head>

<body>

    <div class="container">

        <!-- FORM -->

        <form id="forgotForm">

            <h2>
              Forget Password
            </h2>

            <!-- EMAIL -->

            <div class="input-text">

                <input
                  type="email"
                  id="email"
                  required
                >

                <label>
                  Enter Your Email
                </label>

            </div>

            <!-- REMEMBER -->

            <div class="forget">

                <label for="Remember">

                    <input
                      type="checkbox"
                      id="Remember"
                    >

                    <p>
                      Remember Me
                    </p>

                </label>

            </div>

            <!-- BUTTON -->

            <button type="submit">

                Send Email

            </button>

            <!-- REGISTER -->

            <div class="Register">

                <p>

                  Don't Have an account?

                  <a href="index.html">

                    Register

                  </a>

                </p>

            </div>

        </form>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        const form =

          document.getElementById(
            "forgotForm"
          );

        form.addEventListener(

          "submit",

          async (e) => {

            e.preventDefault();

            // GET EMAIL

            const email =

              document.getElementById(
                "email"
              ).value;

            try {

              // SEND REQUEST

              const response =

                await fetch(

                  "http://localhost:3000/forgot-password",

                  {

                    method: "POST",

                    headers: {

                      "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({

                      email
                    })
                  }
                );

              const data =
                await response.json();

              console.log(data);

              // SUCCESS

              if (data.success) {

                alert(

                  "Reset email sent successfully"
                );
              }

              // ERROR

              else {

                alert(data.error);
              }

            } catch (error) {

              console.log(error);

              alert("Server Error");
            }
          }
        );

    </script>

</body>

</html>
