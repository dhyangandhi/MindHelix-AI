<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>
      Reset Password
    </title>

    <style>

        body {

            font-family: Arial;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            background: #f0f0f0;
        }

        .container {

            background: white;

            padding: 30px;

            border-radius: 10px;

            width: 300px;

            box-shadow:
              0 0 10px rgba(0,0,0,0.1);
        }

        input {

            width: 100%;

            padding: 10px;

            margin-top: 10px;

            margin-bottom: 20px;
        }

        button {

            width: 100%;

            padding: 10px;

            border: none;

            background: black;

            color: white;

            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>
          Reset Password
        </h2>

        <input
          type="password"
          id="password"
          placeholder="New Password"
        >

        <button onclick="resetPassword()">

          Change Password

        </button>

    </div>


    <script>

        async function resetPassword() {

            // GET TOKEN
            const params =

              new URLSearchParams(
                window.location.search
              );

            const token =
              params.get("token");

            // GET PASSWORD
            const password =

              document.getElementById(
                "password"
              ).value;

            try {

              const response =

                await fetch(

                  "/reset-password",

                  {

                    method: "POST",

                    headers: {

                      "Content-Type":
                        "application/json"
                    },

                    body: JSON.stringify({

                      token,
                      password
                    })
                  }
                );

              const data =
                await response.json();

              console.log(data);

              alert(data.message);

              // SUCCESS
              if (data.success) {

                // REDIRECT LOGIN
                window.location.href = "login.html";
              }

            } catch (error) {

              console.log(error);

              alert("Server Error");
            }
        }

    </script>

</body>

</html>
