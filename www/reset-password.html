<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Reset Password - MindHelix AI</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <script src="responsive.js" defer></script>
</head>
<body>

    <!-- BACKGROUND GLOW EFFECTS -->
    <div class="bg-ambient">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- BACK TO HOME NAVIGATION BUTTON -->
    <a href="home.html" class="btn btn-glass back-home-btn" style="position: absolute; top: 24px; left: 24px; z-index: 10;">
        <i class='bx bx-left-arrow-alt' style="font-size: 20px;"></i> Back to Home
    </a>

    <div class="wrapper" style="position: relative; z-index: 2;">
        <h2>Reset Password</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px; text-align: center;">Enter your new password below to regain access to your account.</p>

        <div class="input-box">
            <input type="password" id="password" placeholder="New Password" required minlength="6">
            <i class='bx bxs-lock-alt'></i>
        </div>

        <button onclick="resetPassword()" class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 40px; font-weight: 600; font-size: 15px; cursor: pointer; border: none; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%); color: #fff;">
            Change Password
        </button>
    </div>

    <script>
        async function resetPassword() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            const passwordInput = document.getElementById("password");
            const password = passwordInput ? passwordInput.value : "";
            const btn = document.querySelector("button.btn");

            if (!token) {
                alert("Invalid or missing reset token. Please request a new password reset link.");
                return;
            }

            if (!password || password.trim() === "") {
                alert("Please enter a new password");
                return;
            }

            const originalText = btn ? btn.innerHTML : "Change Password";
            if (btn) {
                btn.disabled = true;
                btn.style.opacity = "0.8";
                btn.style.cursor = "wait";
                btn.innerHTML = "Updating...";
            }

            try {
                const response = await fetch("/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert("Password updated successfully! Redirecting to login...");
                    window.location.replace("login.html");
                } else {
                    alert(data.error || data.message || "Failed to reset password");
                    if (btn) {
                        btn.disabled = false;
                        btn.style.opacity = "1";
                        btn.style.cursor = "pointer";
                        btn.innerHTML = originalText;
                    }
                }

            } catch (error) {
                console.error("Reset error:", error);
                alert("Server error. Please try again.");
                if (btn) {
                    btn.disabled = false;
                    btn.style.opacity = "1";
                    btn.style.cursor = "pointer";
                    btn.innerHTML = originalText;
                }
            }
        }
    </script>
</body>
</html>
