<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Forgot Password
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="wrapper">

        <form id="forgotForm">

            <h1>
                Forgot Password
            </h1>

            <!-- EMAIL -->

            <div class="input-box">

                <input type="email" id="email" placeholder="Enter your email" required>

            </div>

            <!-- BUTTON -->

            <button type="submit" class="btn">

                Send Reset Link

            </button>

            <!-- LOGIN -->

            <div class="register-link">

                <p>

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </div>

        </form>

    </div>


    <!-- SCRIPT -->

    <script>

        const form =

            document.getElementById(
                "forgotForm"
            );


        form.addEventListener(

            "submit",

            async function (e) {

                e.preventDefault();

                const email =

                    document.getElementById(
                        "email"
                    ).value;

                try {

                    const response =

                        await fetch(

                            "/forgot-password",

                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    email
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (data.success) {

                        alert(
                            "Reset email sent"
                        );

                        window.location.href =
                            "/";

                    } else {

                        alert(
                            data.error
                        );
                    }

                } catch (error) {

                    console.log(error);

                    alert(
                        "Server error"
                    );
                }
            }
        );

    </script>

</body>

</html>
