<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Forgot Password - MindHelix AI</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Home, Style & Responsive Stylesheets -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <script src="responsive.js" defer></script>
</head>
<body>

    <!-- INTERACTIVE NEURAL PARTICLES CANVAS -->
    <canvas id="neuralCanvas" class="neural-canvas"></canvas>

    <!-- AMBIENT CURSOR GLOW FOLLOWER -->
    <div id="cursorGlow" class="cursor-glow"></div>

    <!-- BACKGROUND GLOW EFFECTS -->
    <div class="bg-ambient">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- BACK TO LOGIN NAVIGATION BUTTON -->
    <a href="login.html" class="btn btn-glass back-home-btn magnetic-btn" id="backLoginBtn" style="position: absolute; top: 24px; left: 24px; z-index: 100;">
        <i class='bx bx-left-arrow-alt' style="font-size: 20px;"></i> Back to Login
    </a>

    <!-- 3D PERSPECTIVE STAGE -->
    <div class="login-3d-scene" id="forgotScene">

        <!-- 3D ROTATING HOLOGRAPHIC CYBER RINGS -->
        <div class="cyber-ring ring-1"></div>
        <div class="cyber-ring ring-2"></div>

        <!-- 3D GLASSMORPHISM CARD WITH PARALLAX DEPTH -->
        <div class="login-card-3d" id="forgotCard">

            <!-- SPECULAR DYNAMIC CARD GLINT -->
            <div class="card-glint" id="cardGlint"></div>

            <!-- 3D FLOATING SATELLITE BADGES -->
            <div class="sat-badge sat-top-right">
                <span class="pulse-dot"></span>
                <span>256-Bit SSL Encrypted</span>
            </div>
            <div class="sat-badge sat-bottom-left">
                <i class="fa-solid fa-shield-halved" style="color: #ff8a65;"></i>
                <span>Recovery Protocol v2.5</span>
            </div>

            <!-- CARD HEADER: BRAND & TITLES -->
            <div class="card-layer-brand">
                <div class="login-brand-icon">
                    <img src="logo.svg" alt="MindHelix AI Logo">
                </div>
                <h1 class="login-title">Reset <span class="gradient-text">Password</span></h1>
                <p class="login-subtitle">Enter your registered email address to receive an instant recovery link</p>
            </div>

            <!-- INLINE NOTIFICATION / ALERT BANNER -->
            <div id="statusAlert" style="display:none; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; font-size: 13.5px; align-items: center; gap: 10px; text-align: left; transform: translateZ(30px); transition: all 0.3s ease;">
                <i id="statusIcon" class="fa-solid fa-circle-exclamation" style="font-size: 16px; flex-shrink: 0;"></i>
                <span id="statusMessage" style="font-weight: 500;"></span>
            </div>

            <!-- 3D FORM -->
            <form id="forgotForm" class="login-form-3d" onsubmit="handleForgotPassword(event)">

                <!-- EMAIL FIELD -->
                <div class="input-box">
                    <input type="email" id="email" placeholder="Registered email address" required autocomplete="email">
                    <i class='bx bxs-envelope input-icon'></i>
                </div>

                <!-- 3D PRIMARY ACTION BUTTON -->
                <button type="submit" id="submitBtn" class="btn-login-3d magnetic-btn">
                    <i class='bx bx-paper-plane' style="font-size: 20px;"></i>
                    <span>Send Recovery Link</span>
                </button>

                <!-- OR DIVIDER -->
                <div class="or-divider">
                    <span>OR</span>
                </div>

                <!-- NAVIGATION LINKS -->
                <div class="register-link" style="display: flex; flex-direction: column; gap: 10px;">
                    <p>
                        Remember your password?
                        <a href="login.html">Sign In</a>
                    </p>
                    <p style="font-size: 13px; color: #64748b;">
                        Don't have an account?
                        <a href="register.html">Register</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <!-- 3D INTERACTIVE ANIMATION & RECOVERY ENGINE -->
    <script>
    // 1. Interactive Neural Particle Canvas
    function initNeuralCanvas() {
        const canvas = document.getElementById('neuralCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        let width, height;
        let particles = [];
        const particleCount = Math.min(60, Math.max(30, Math.floor(window.innerWidth / 30)));
        const mouse = { x: -9999, y: -9999, radius: 140, active: false };

        function resize() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            ctx.scale(dpr, dpr);
        }
        resize();
        window.addEventListener('resize', resize);

        const colors = [
            'rgba(255, 94, 54, 0.75)',
            'rgba(255, 138, 101, 0.7)',
            'rgba(168, 85, 247, 0.65)',
            'rgba(56, 189, 248, 0.6)',
            'rgba(255, 255, 255, 0.65)'
        ];

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                vx: (Math.random() - 0.5) * 0.7,
                vy: (Math.random() - 0.5) * 0.7,
                radius: Math.random() * 2 + 1,
                color: colors[Math.floor(Math.random() * colors.length)],
                pulse: Math.random() * Math.PI * 2,
                pulseSpeed: 0.02 + Math.random() * 0.02
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.pulse += p.pulseSpeed;

                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) { p.x = 0; p.vx *= -1; }
                else if (p.x > width) { p.x = width; p.vx *= -1; }
                if (p.y < 0) { p.y = 0; p.vy *= -1; }
                else if (p.y > height) { p.y = height; p.vy *= -1; }

                if (mouse.active) {
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < mouse.radius && dist > 0) {
                        const force = (1 - dist / mouse.radius) * 1.8;
                        p.x += (dx / dist) * force;
                        p.y += (dy / dist) * force;
                    }
                }

                const currentRadius = p.radius + Math.sin(p.pulse) * 0.5;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.max(0.6, currentRadius), 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = 115;

                    if (dist < maxDist) {
                        const alpha = (1 - dist / maxDist) * 0.32;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(255, 110, 60, ${alpha.toFixed(3)})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }

                if (mouse.active) {
                    const dx = p.x - mouse.x;
                    const dy = p.y - mouse.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        const alpha = (1 - dist / 130) * 0.45;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(mouse.x, mouse.y);
                        ctx.strokeStyle = `rgba(255, 94, 54, ${alpha.toFixed(3)})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }
        animate();
    }

    // 2. Ambient Cursor Glow Follower
    function initCursorGlow() {
        const glow = document.getElementById('cursorGlow');
        if (!glow) return;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let curX = mouseX;
        let curY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function renderGlow() {
            curX += (mouseX - curX) * 0.12;
            curY += (mouseY - curY) * 0.12;
            glow.style.transform = `translate(${curX}px, ${curY}px) translate(-50%, -50%)`;
            requestAnimationFrame(renderGlow);
        }
        renderGlow();
    }

    // 3. 3D Card Gyroscope & Parallax Tilt
    function init3DCardTilt() {
        const card = document.getElementById('forgotCard');
        const scene = document.getElementById('forgotScene');
        const glint = document.getElementById('cardGlint');
        if (!card) return;

        let curRotX = 0;
        let curRotY = 0;
        let targetRotX = 0;
        let targetRotY = 0;
        let isHovered = false;
        let rafId = null;

        function updateCardTransform() {
            curRotX += (targetRotX - curRotX) * 0.08;
            curRotY += (targetRotY - curRotY) * 0.08;

            card.style.transform = `rotateX(${curRotX.toFixed(2)}deg) rotateY(${curRotY.toFixed(2)}deg)`;

            if (Math.abs(curRotX - targetRotX) > 0.01 || Math.abs(curRotY - targetRotY) > 0.01) {
                rafId = requestAnimationFrame(updateCardTransform);
            } else {
                rafId = null;
            }
        }

        function handlePointerMove(e) {
            const rect = card.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const percentX = (e.clientX - centerX) / (window.innerWidth / 2);
            const percentY = (e.clientY - centerY) / (window.innerHeight / 2);

            targetRotY = Math.max(-16, Math.min(16, percentX * 18));
            targetRotX = Math.max(-16, Math.min(16, -percentY * 18));

            if (glint) {
                const glintX = ((e.clientX - rect.left) / rect.width) * 100;
                const glintY = ((e.clientY - rect.top) / rect.height) * 100;
                glint.style.background = `radial-gradient(circle at ${glintX}% ${glintY}%, rgba(255, 255, 255, 0.22) 0%, transparent 60%)`;
                glint.style.opacity = '1';
            }

            isHovered = true;
            if (!rafId) {
                rafId = requestAnimationFrame(updateCardTransform);
            }
        }

        function handlePointerLeave() {
            targetRotX = 0;
            targetRotY = 0;
            isHovered = false;
            if (glint) {
                glint.style.opacity = '0.6';
            }
            if (!rafId) {
                rafId = requestAnimationFrame(updateCardTransform);
            }
        }

        window.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const padding = 120;
            if (
                e.clientX >= rect.left - padding &&
                e.clientX <= rect.right + padding &&
                e.clientY >= rect.top - padding &&
                e.clientY <= rect.bottom + padding
            ) {
                handlePointerMove(e);
            } else if (isHovered) {
                handlePointerLeave();
            }
        });

        if (scene) {
            scene.addEventListener('mouseleave', handlePointerLeave);
        }

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (e.gamma !== null && e.beta !== null && window.innerWidth <= 800) {
                    targetRotY = Math.max(-14, Math.min(14, e.gamma * 0.7));
                    targetRotX = Math.max(-14, Math.min(14, (e.beta - 45) * 0.7));
                    if (!rafId) {
                        rafId = requestAnimationFrame(updateCardTransform);
                    }
                }
            });
        }
    }

    // 4. Magnetic Button Pull Effect
    function initMagneticButtons() {
        const buttons = document.querySelectorAll('.magnetic-btn');
        buttons.forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - (rect.left + rect.width / 2);
                const y = e.clientY - (rect.top + rect.height / 2);
                btn.style.transform = `translate(${x * 0.25}px, ${y * 0.25}px)`;
            });

            btn.addEventListener('mouseleave', () => {
                btn.style.transform = 'translate(0px, 0px)';
            });
        });
    }

    // 5. Button Ripple Animation
    function initButtonRipples() {
        document.querySelectorAll('.btn-login-3d, .btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const rect = btn.getBoundingClientRect();
                const circle = document.createElement('span');
                circle.classList.add('btn-ripple');
                const diameter = Math.max(rect.width, rect.height);
                const radius = diameter / 2;
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                btn.appendChild(circle);
                setTimeout(() => circle.remove(), 600);
            });
        });
    }

    // 6. Notification Alert Display Helper
    function showAlert(message, type = "error") {
        const alertBox = document.getElementById("statusAlert");
        const alertIcon = document.getElementById("statusIcon");
        const alertMsg = document.getElementById("statusMessage");
        if (!alertBox || !alertMsg) return;

        alertMsg.textContent = message;
        alertBox.style.display = "flex";

        if (type === "success") {
            alertBox.style.background = "rgba(16, 185, 129, 0.15)";
            alertBox.style.border = "1px solid rgba(16, 185, 129, 0.4)";
            alertBox.style.color = "#a7f3d0";
            alertBox.style.boxShadow = "0 4px 15px rgba(16, 185, 129, 0.15)";
            if (alertIcon) {
                alertIcon.className = "fa-solid fa-circle-check";
                alertIcon.style.color = "#34d399";
            }
        } else {
            alertBox.style.background = "rgba(239, 68, 68, 0.15)";
            alertBox.style.border = "1px solid rgba(239, 68, 68, 0.4)";
            alertBox.style.color = "#fecaca";
            alertBox.style.boxShadow = "0 4px 15px rgba(239, 68, 68, 0.15)";
            if (alertIcon) {
                alertIcon.className = "fa-solid fa-circle-exclamation";
                alertIcon.style.color = "#f87171";
            }
        }
    }

    // 7. Password Recovery Form Submission
    async function handleForgotPassword(e) {
        e.preventDefault();
        const emailInput = document.getElementById("email");
        const submitBtn = document.getElementById("submitBtn");
        const email = emailInput ? emailInput.value.trim() : "";

        if (!email) {
            showAlert("Please enter your registered email address.", "error");
            return;
        }

        const originalHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.85";
        submitBtn.style.cursor = "wait";
        submitBtn.innerHTML = "<i class='bx bx-loader-alt bx-spin' style='font-size: 20px; margin-right: 8px; vertical-align: middle;'></i> Sending link...";

        try {
            const response = await fetch("/forgot-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            let data;
            const text = await response.text();
            try {
                data = JSON.parse(text);
            } catch (err) {
                throw new Error(text || `Server returned error (${response.status})`);
            }

            if (data.success) {
                submitBtn.innerHTML = "<i class='bx bx-check-circle' style='font-size: 22px; margin-right: 8px; vertical-align: middle;'></i> Email Sent!";
                submitBtn.style.background = "linear-gradient(135deg, #10b981, #059669)";
                submitBtn.style.boxShadow = "0 12px 30px rgba(16, 185, 129, 0.4)";
                
                showAlert("Recovery link has been sent to your email. Please check your inbox (and spam folder).", "success");
                
                // Keep the input disabled on success to prevent accidental duplicate requests
                if (emailInput) emailInput.disabled = true;

                setTimeout(() => {
                    submitBtn.innerHTML = "<span>Return to Login</span> <i class='bx bx-right-arrow-alt' style='font-size: 20px;'></i>";
                    submitBtn.disabled = false;
                    submitBtn.style.cursor = "pointer";
                    submitBtn.onclick = () => window.location.href = "login.html";
                }, 2000);
            } else {
                showAlert(data.error || "Failed to send reset link. Please verify your email.", "error");
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
                submitBtn.style.cursor = "pointer";
                submitBtn.innerHTML = originalHtml;
            }
        } catch (error) {
            console.error("Forgot password error:", error);
            showAlert(error.message || "Unable to reach authentication server. Please check your connection.", "error");
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
            submitBtn.style.cursor = "pointer";
            submitBtn.innerHTML = originalHtml;
        }
    }

    // 8. Master Animation Initializer
    function initAnimations() {
        initNeuralCanvas();
        initCursorGlow();
        init3DCardTilt();
        initMagneticButtons();
        initButtonRipples();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAnimations);
    } else {
        initAnimations();
    }
    </script>
</body>
</html>
