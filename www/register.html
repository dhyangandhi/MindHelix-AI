<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Register - MindHelix AI</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="2style.css">
    <link rel="stylesheet" href="responsive.css">

    <script src="responsive.js" defer></script>
    <script src="form.js" defer></script>
</head>
<body class="register-page">

    <!-- BACKGROUND GLOW EFFECTS (Same as Home Page) -->
    <div class="bg-ambient">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- BACK TO HOME NAVIGATION BUTTON -->
    <a href="home.html" class="btn btn-glass back-home-btn" style="position: absolute; top: 24px; left: 24px; z-index: 10;">
        <i class='bx bx-left-arrow-alt' style="font-size: 20px;"></i> Back to Home
    </a>

    <div class="wrapper" style="position: relative; z-index: 2;">
        <form id="registerForm" onsubmit="event.preventDefault(); registerUser();">
            <h1>Registration</h1>

            <div class="input-box">
                <div class="input-field">
                    <input type="text" id="fullname" placeholder="Full Name" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-field">
                    <input type="text" id="username" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-field">
                    <input type="email" id="email" placeholder="Email" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-field">
                    <input type="text" id="mobileNumber" placeholder="Mobile Number" required>
                    <i class='bx bxs-phone'></i>
                </div>

                <div class="input-field">
                    <input type="password" id="password" placeholder="Password" required>
                    <i class='bx bxs-lock'></i>
                </div>

                <div class="input-field">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class='bx bxs-lock'></i>
                </div>
            </div>

            <button type="submit" id="registerBtn" class="btn">
                Register
            </button>

            <div class="or-divider">
                <span>OR</span>
            </div>

            <p class="already-account">
                Already have an account?
            </p>
            <button type="button" onclick="window.location.href='login.html'" class="btn">
                Login
            </button>
        </form>
    </div>
</body>
</html>
