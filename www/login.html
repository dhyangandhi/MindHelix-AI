<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MindHelix AI</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Home & Login Stylesheets -->
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND GLOW EFFECTS (Same as Home Page) -->
    <div class="bg-ambient">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- BACK TO HOME NAVIGATION BUTTON -->
    <a href="home.html" class="btn btn-glass" style="position: absolute; top: 24px; left: 24px; z-index: 10;">
        <i class='bx bx-left-arrow-alt' style="font-size: 20px;"></i> Back to Home
    </a>

    <div class="wrapper" style="position: relative; z-index: 2;">
        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="loginUser(event)">
            <h1>Login</h1>

            <!-- EMAIL -->
            <div class="input-box">
                <input type="email" id="email" placeholder="Email" required>
                <i class='bx bxs-user'></i>
            </div>

            <!-- PASSWORD -->
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <!-- REMEMBER + FORGOT -->
            <div class="remember-forget">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <!-- LOGIN BUTTON -->
            <button type="submit" id="loginBtn" class="btn">Login</button>

            <!-- OR DIVIDER -->
            <div class="or-divider">
                <span>OR</span>
            </div>

            <!-- REGISTER -->
            <div class="register-link" style="margin-top: 10px; text-align: center;">
                <p>
                    Don't Have an account?
                    <a href="register.html" style="color: #fff; font-weight: 600; text-decoration: underline;">Register</a>
                </p>
            </div>
        </form>
    </div>

    <!-- LOGIN SCRIPT -->
    <script>
    if (localStorage.getItem("user")) {
        window.location.replace("ai.html");
    }

    async function loginUser(e) {
        e.preventDefault();
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn") || e.target.querySelector("button[type='submit']");

        const email = emailInput ? emailInput.value.trim() : "";
        const password = passwordInput ? passwordInput.value : "";

        if (!email || !password) {
            alert("Please enter both email and password");
            return;
        }

        // Instant visual feedback
        const originalHtml = loginBtn.innerHTML;
        loginBtn.disabled = true;
        loginBtn.style.opacity = "0.8";
        loginBtn.style.cursor = "wait";
        loginBtn.innerHTML = "<i class='bx bx-loader-alt bx-spin' style='font-size: 18px; margin-right: 6px; vertical-align: middle;'></i> Logging in...";

        try {
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                loginBtn.innerHTML = "<i class='bx bx-check' style='font-size: 20px; margin-right: 6px; vertical-align: middle;'></i> Success!";
                localStorage.setItem("user", JSON.stringify(data.user));
                window.location.replace("ai.html");
            } else {
                alert(data.error || "Login failed");
                loginBtn.disabled = false;
                loginBtn.style.opacity = "1";
                loginBtn.style.cursor = "pointer";
                loginBtn.innerHTML = originalHtml;
            }
        } catch (error) {
            console.error("Login error:", error);
            alert("Login failed. Please check your connection and try again.");
            loginBtn.disabled = false;
            loginBtn.style.opacity = "1";
            loginBtn.style.cursor = "pointer";
            loginBtn.innerHTML = originalHtml;
        }
    }
    </script>
</body>
</html>
