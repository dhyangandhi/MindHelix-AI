<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    >

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >
    
    <title>Login</title>

    <link
      rel="stylesheet"
      href="1style.css"
    >

    <script
      type="module"
      src="index1.js"
    ></script>

    <script src="form.js" defer></script>

    <link
      href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
      rel='stylesheet'
    >

</head>

<body>

    <div class="wrapper">

        <!-- LOGIN FORM -->

        <form id="loginForm">

            <h1>Login</h1>

            <!-- EMAIL -->

            <div class="input-box">

                <input
                  type="email"
                  id="email"
                  placeholder="Email"
                  required
                >

                <i class='bx bxs-user'></i>

            </div>

            <!-- PASSWORD -->

            <div class="input-box">

                <input
                  type="password"
                  id="password"
                  placeholder="Password"
                  required
                >

                <i class='bx bxs-lock-alt'></i>

            </div>

            <!-- REMEMBER + FORGOT -->

            <div class="remember-forget">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <!-- LOGIN BUTTON -->

            <button
              type="submit"
              class="btn"
            >

              Login

            </button>

            <!-- REGISTER -->

            <div class="register-link">

                <p>

                    Don't Have an account?

                    <a href="1Registration.html">

                        Register

                    </a>

                </p>

            </div>

        </form>

    </div>

</body>

</html>
